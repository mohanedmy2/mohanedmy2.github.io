<style>
body{margin:0;background:#F4F1EA;font-family:"IBM Plex Sans","Segoe UI",Helvetica,sans-serif;color:#1B2433}
a{color:#0E1E33;text-decoration:none}a:hover{color:#8A4F0E}
button{font-family:inherit;cursor:pointer}
img{display:block;max-width:100%}
.zoom{transition:transform .5s ease}.zoom:hover{transform:scale(1.04)}
.lift{transition:transform .25s ease, box-shadow .25s ease}.lift:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(14,30,51,.14)}
</style>

<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column">

<!-- ================= HERO ================= -->
<header style="position: relative; background-color: #0E1E33; background-image: linear-gradient(rgba(227,168,87,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(227,168,87,0.07) 1px, transparent 1px); background-size: 40px 40px; color: #F4F1EA; padding: clamp(28px, 5vw, 64px) clamp(16px, 6vw, 104px) 56px; display: flex; flex-direction: column; gap: 44px">
<nav style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border: 1.5px solid #E3A857; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 18px; color: #E3A857">ME</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2.5px; color: #AEB9C8">QUALITY · PROJECTS · DATA</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 2px">
<a href="#career" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 14px; color: #D5DDE8">Career</a>
<a href="#digital" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 14px; color: #D5DDE8">Digital QA</a>
<a href="#projects" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 14px; color: #D5DDE8">Projects</a>
<a href="#certs" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 14px; color: #D5DDE8">Credentials</a>
<a href="#contact" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 14px; color: #D5DDE8">Contact</a>
</div>
</nav>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 48px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<div style="flex-shrink: 0; width: 132px; height: 132px; padding: 4px; border-radius: 50%; background: linear-gradient(145deg, #F3D3A3, #E3A857 45%, #8A4F0E); box-shadow: 0 0 0 8px rgba(227,168,87,0.12), 0 18px 40px rgba(0,0,0,0.35); box-sizing: border-box">
<img src="./img/headshot.jpg" alt="Portrait of Mohaned El Taher" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 30%; background: #FFFFFF; border: 3px solid #0E1E33; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid #3A5578; border-radius: 999px; font-size: 13px; color: #D5DDE8">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #7FC8A9"></span>Jeddah, Saudi Arabia · Open to senior roles</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #AEB9C8">CCQM · PMP® · ISO 9001 LEAD AUDITOR</div>
</div>
</div>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(46px, 7.5vw, 100px); line-height: 0.98; letter-spacing: -1.5px">Mohaned<br>El Taher</h1>
<div style="font-size: clamp(18px, 2.1vw, 25px); font-weight: 500; line-height: 1.4">Quality Manager · Senior QA/QC Engineer<br><span style="color: #E3A857">PMC &amp; Construction Supervision Consultancy</span></div>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #AEB9C8; max-width: 600px">15+ years delivering residential, institutional, infrastructure and Oil &amp; Gas projects in Saudi Arabia and Sudan — representing the Client, closing the nonconformance loop, and turning site quality data into decisions.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 4px">
<a href="mailto:mohanedmy@hotmail.com" style="display: inline-flex; align-items: center; min-height: 50px; padding: 0 24px; background: #E3A857; color: #0E1E33; border-radius: 6px; font-weight: 600; font-size: 16px">Start a conversation</a>
<a href="https://linkedin.com/in/mohaned-eltaher-pmc-epc" style="display: inline-flex; align-items: center; min-height: 50px; padding: 0 24px; border: 1.5px solid #5A7394; color: #F4F1EA; border-radius: 6px; font-weight: 500; font-size: 16px">View LinkedIn</a>
</div>
</div>

<div style="position: relative; border-radius: 14px; overflow: hidden; border: 1px solid #2A3F5E; min-height: 420px; background: #1C3150">
<img src="./img/nhc-pour.jpg" alt="Concrete pour on a residential block, NHC Dania Al Sadan project, Jeddah" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,30,51,0) 40%, rgba(14,30,51,0.92) 100%)"></div>
<div style="position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #E3A857">ON SITE · NHC DANIA AL SADAN · JEDDAH</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 7px 12px; background: rgba(244,241,234,0.12); border: 1px solid rgba(244,241,234,0.25); border-radius: 999px; font-size: 13px; font-weight: 500">ASQ CCQM</span>
<span style="padding: 7px 12px; background: rgba(244,241,234,0.12); border: 1px solid rgba(244,241,234,0.25); border-radius: 999px; font-size: 13px; font-weight: 500">PMP®</span>
<span style="padding: 7px 12px; background: rgba(244,241,234,0.12); border: 1px solid rgba(244,241,234,0.25); border-radius: 999px; font-size: 13px; font-weight: 500">ISO 9001 Lead Auditor</span>
<span style="padding: 7px 12px; background: rgba(244,241,234,0.12); border: 1px solid rgba(244,241,234,0.25); border-radius: 999px; font-size: 13px; font-weight: 500">SCE Engineer</span>
</div>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: #2A3F5E; border: 1px solid #2A3F5E; border-radius: 10px; overflow: hidden">
<div style="background: #0E1E33; padding: 22px; display: flex; flex-direction: column; gap: 4px"><div style="font-family: Fraunces, Georgia, serif; font-size: 42px; font-weight: 600; color: #E3A857">15+</div><div style="font-size: 14px; color: #AEB9C8">Years in construction quality &amp; delivery</div></div>
<div style="background: #0E1E33; padding: 22px; display: flex; flex-direction: column; gap: 4px"><div style="font-family: Fraunces, Georgia, serif; font-size: 42px; font-weight: 600; color: #E3A857">70+</div><div style="font-size: 14px; color: #AEB9C8">Oil &amp; Gas and infrastructure projects (PMC)</div></div>
<div style="background: #0E1E33; padding: 22px; display: flex; flex-direction: column; gap: 4px"><div style="font-family: Fraunces, Georgia, serif; font-size: 42px; font-weight: 600; color: #E3A857">4,312</div><div style="font-size: 14px; color: #AEB9C8">NHC housing units supervised</div></div>
<div style="background: #0E1E33; padding: 22px; display: flex; flex-direction: column; gap: 4px"><div style="font-family: Fraunces, Georgia, serif; font-size: 42px; font-weight: 600; color: #E3A857">&lt;3%</div><div style="font-size: 14px; color: #AEB9C8">Quality KPIs vs. 10% allowed</div></div>
</div>
</header>

<main style="padding: 0 clamp(16px, 6vw, 104px); display: flex; flex-direction: column; gap: 104px; padding-top: 96px; padding-bottom: 104px">

<!-- ================= CAREER ================= -->
<section id="career" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #8A4F0E">01 — CAREER TIMELINE</div>
<h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(32px, 4vw, 48px); line-height: 1.1; color: #0E1E33">From site to system</h2>
</div>
<div style="font-size: 14px; color: #56606E">Select a role to explore it</div>
</div>

<div style="background: #FFFFFF; border: 1px solid #DDD8CD; border-radius: 14px; padding: clamp(18px, 3vw, 36px); display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 18px; background: #EDE9E0; border-radius: 999px; overflow: hidden">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="5"><div style="{{r.segStyle}}"></div></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #56606E"><span>2010</span><span>2014</span><span>2018</span><span>2022</span><span>2026</span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
<button type="button" onClick="{{r.pick}}" style="{{r.tabStyle}}">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px">{{r.short}}</span>
<span style="font-size: 15px; font-weight: 600; line-height: 1.3">{{r.role}}</span>
<span style="font-size: 13px; opacity: 0.8">{{r.company}}</span>
</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px; border-top: 1px solid #EDE9E0; padding-top: 28px">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8A4F0E">{{sel.period}}</div>
<h3 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.15; color: #0E1E33">{{sel.role}}</h3>
<div style="font-size: 16px; font-weight: 600; color: #3A4658">{{sel.company}}</div>
<div style="font-size: 15px; line-height: 1.5; color: #56606E">{{sel.project}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 6px">
<sc-for list="{{sel.facts}}" as="f" hint-placeholder-count="2">
<div style="background: #F4F1EA; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
<div style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 600; color: #0E1E33">{{f.v}}</div>
<div style="font-size: 12px; line-height: 1.4; color: #56606E">{{f.l}}</div>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6">
<sc-for list="{{sel.points}}" as="p" hint-placeholder-count="3"><li>{{p}}</li></sc-for>
</ul>
<sc-if value="{{sel.hasWin}}" hint-placeholder-val="{{ true }}">
<div style="background: #0E1E33; color: #F4F1EA; border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #E3A857">KEY ACHIEVEMENT</div>
<div style="font-size: 15px; line-height: 1.6">{{sel.win}}</div>
</div>
</sc-if>
</div>
</div>
</div>
</section>

<!-- ================= QUALITY KPI ================= -->
<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #8A4F0E">02 — QUALITY PERFORMANCE</div>
<h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(32px, 4vw, 48px); line-height: 1.1; color: #0E1E33">Less than a third of the allowed margin</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3A4658">On the NHC Dania Al Sadan development (2,706 units), every tracked quality KPI stays below 3% — against a contractual allowance of 10%.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="3"><button type="button" onClick="{{k.pick}}" style="{{k.style}}">{{k.label}}</button></sc-for>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #DDD8CD; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<svg viewBox="0 0 220 130" style="width: 100%; max-width: 420px" aria-label="Gauge: KPI below 3 percent against a 10 percent threshold">
<path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="#EDE9E0" stroke-width="16" stroke-linecap="round"></path>
<path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="#F3D3A3" stroke-width="16" stroke-dasharray="235.6 283" opacity="0.6"></path>
<path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="#0E1E33" stroke-width="16" stroke-linecap="round" style="{{gaugeStyle}}"></path>
<line x1="177.5" y1="71" x2="198.3" y2="59" stroke="#B4461E" stroke-width="2.5"></line>
<text x="196" y="50" font-size="9" fill="#B4461E" font-family="IBM Plex Mono, monospace" text-anchor="middle">10% limit</text>
<text x="110" y="98" font-size="30" fill="#0E1E33" font-family="Fraunces, Georgia, serif" font-weight="600" text-anchor="middle">&lt;3%</text>
<text x="110" y="122" font-size="9" fill="#56606E" font-family="IBM Plex Sans, sans-serif" text-anchor="middle">{{kpiName}}</text>
</svg>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; font-size: 13px; color: #3A4658">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #0E1E33"></span>Achieved</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #F3D3A3"></span>Allowable range</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 3px; background: #B4461E"></span>Threshold</span>
</div>
<button type="button" onClick="{{replay}}" style="min-height: 44px; padding: 0 18px; border: 1px solid #0E1E33; background: transparent; border-radius: 6px; font-size: 14px; font-weight: 500; color: #0E1E33">Replay</button>
</div>
</section>

<!-- ================= DIGITAL QA ================= -->
<section id="digital" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 10px; max-width: 820px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #8A4F0E">03 — DIGITAL QUALITY SYSTEMS</div>
<h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(32px, 4vw, 48px); line-height: 1.1; color: #0E1E33">Tools I built for the quality department</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3A4658">Live dashboards and a field app built on the Dania Al Sadan project, so inspection status, concrete progress and snag lists are visible to the team in real time — not buried in spreadsheets.</p>
</div>

<div style="background: #FFFFFF; border: 1px solid #DDD8CD; border-radius: 14px; padding: clamp(16px, 3vw, 32px); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{dashTabs}}" as="d" hint-placeholder-count="2"><button type="button" onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<button type="button" onClick="{{dash.open}}" style="flex: 2 1 520px; min-width: 0; padding: 0; border: 1px solid #DDD8CD; border-radius: 10px; overflow: hidden; background: #0E1E33" aria-label="Enlarge dashboard">
<img src="{{dash.src}}" alt="{{dash.title}}" style="width: 100%; height: auto">
</button>
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 14px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #8A4F0E">{{dash.tag}}</div>
<h3 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.2; color: #0E1E33">{{dash.title}}</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.6">
<sc-for list="{{dash.points}}" as="p" hint-placeholder-count="4"><li>{{p}}</li></sc-for>
</ul>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px">
<sc-for list="{{dash.stack}}" as="s" hint-placeholder-count="3"><span style="padding: 6px 12px; background: #F4F1EA; border-radius: 999px; font-size: 13px; font-weight: 500">{{s}}</span></sc-for>
</div>
<div style="font-size: 13px; color: #56606E">Tap the image to enlarge.</div>
</div>
</div>
</div>

<div style="background: #0E1E33; color: #F4F1EA; border-radius: 14px; padding: clamp(20px, 3vw, 40px); display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 36px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #E3A857">FIELD APP · OFFLINE · ANDROID</div>
<h3 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(30px, 3.4vw, 42px); line-height: 1.1">Snag PRO</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #C9D2DE">An offline snag-list app I designed and built for building handover inspections. Inspectors photograph defects on site, tag floor and discipline, and export a finished snag sheet in the project's approved Excel format — ready to issue to the contractor.</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{snagSteps}}" as="st" hint-placeholder-count="3">
<div style="display: flex; gap: 14px; align-items: flex-start">
<div style="flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: #E3A857; color: #0E1E33; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500">{{st.n}}</div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 16px; font-weight: 600">{{st.t}}</div><div style="font-size: 14px; line-height: 1.5; color: #AEB9C8">{{st.d}}</div></div>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; gap: 14px; justify-content: center; align-items: flex-end; flex-wrap: wrap">
<sc-for list="{{phones}}" as="ph" hint-placeholder-count="3">
<button type="button" onClick="{{ph.open}}" class="lift" style="{{ph.frame}}" aria-label="{{ph.cap}}">
<img src="{{ph.src}}" alt="{{ph.cap}}" style="width: 100%; height: auto; border-radius: 14px">
<span style="display: block; padding-top: 8px; font-size: 12px; color: #AEB9C8; text-align: center">{{ph.cap}}</span>
</button>
</sc-for>
</div>
</div>
</section>

<!-- ================= PROJECTS ================= -->
<section id="projects" style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #8A4F0E">04 — PROJECT PORTFOLIO</div>
<h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(32px, 4vw, 48px); line-height: 1.1; color: #0E1E33">Work you can see</h2>
